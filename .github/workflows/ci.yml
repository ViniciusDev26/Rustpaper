name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/viniciusdev26/rustpaper-ci

# Cancel older runs of the same branch/PR when a new push arrives.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # Builds/publishes the CI image (docker/ci/Dockerfile: Ubuntu 24.04 + Rust
  # toolchain + the workspace's system deps) BEFORE the other jobs, so the tag
  # used below always matches this commit's Dockerfile. When the Dockerfile
  # did not change, the cache (type=gha) makes this nearly instant.
  #
  # Tag per event: a push to main publishes `:latest` (what other main runs
  # expect); a PR publishes an isolated `:pr-<number>` tag, so the PR's suite
  # runs without overwriting the `:latest` that main uses.
  image:
    name: Build CI image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: tag
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "image=${{ env.IMAGE }}:pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "image=${{ env.IMAGE }}:latest" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ci/Dockerfile
          push: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  fmt:
    name: Format
    needs: image
    runs-on: ubuntu-latest
    container: ${{ needs.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    needs: image
    runs-on: ubuntu-latest
    container: ${{ needs.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      # Fixed shared-key: otherwise rust-cache keys on the job name and
      # clippy/build/test each rebuild the deps (wgpu, webkit2gtk-sys, gtk...)
      # from scratch, even though they run one after another on the same image.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rustpaper-ci
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  build:
    name: Build
    needs: image
    runs-on: ubuntu-latest
    container: ${{ needs.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      # Fixed shared-key: otherwise rust-cache keys on the job name and
      # clippy/build/test each rebuild the deps (wgpu, webkit2gtk-sys, gtk...)
      # from scratch, even though they run one after another on the same image.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rustpaper-ci
      - run: cargo build --workspace --all-targets --verbose

  test:
    name: Test
    needs: [image, build]
    runs-on: ubuntu-latest
    container: ${{ needs.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      # Fixed shared-key: otherwise rust-cache keys on the job name and
      # clippy/build/test each rebuild the deps (wgpu, webkit2gtk-sys, gtk...)
      # from scratch, even though they run one after another on the same image.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rustpaper-ci
      - run: cargo test --workspace --verbose
