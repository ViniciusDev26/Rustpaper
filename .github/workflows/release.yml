name: Release

# Conventional Commits on main -> release-please keeps a "release PR" open
# (version bump + CHANGELOG). Merging it tags vX.Y.Z and creates the GitHub
# release; then the prebuilt tarball is attached, the pacman repository
# (the `pacman-repo` release) and the AUR packages are updated. See
# docs/RELEASING.md.

on:
  push:
    branches: [main]

# One run at a time, queued, never cancelled: two merges seconds apart once
# ran release-please twice at once and the lockfile job's push was rejected
# (the other run had just rewritten the release branch, 2026-11-23).
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # dispatching CI on the release PR (lockfile job)
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
      pr_branch: ${{ steps.rp.outputs.pr && fromJSON(steps.rp.outputs.pr).headBranchName || '' }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please bumps Cargo.toml but not Cargo.lock (the workspace crates'
  # versions are recorded there too, and `--locked` builds would refuse a
  # stale lockfile): refresh it on the release PR's branch.
  lockfile:
    needs: release-please
    if: needs.release-please.outputs.pr_branch != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.pr_branch }}
      - run: cargo update --workspace
      - name: Commit Cargo.lock
        run: |
          if git diff --quiet Cargo.lock; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update Cargo.lock for the release"
          git push
      # Pushes with GITHUB_TOKEN (release-please's and the one above) start
      # no pull_request run, so the PR would never get the checks main
      # requires: dispatch them on the branch.
      - name: Run the required checks on the release PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ needs.release-please.outputs.pr_branch }}
        run: |
          gh workflow run ci.yml --ref "$BRANCH" --repo "$GITHUB_REPOSITORY"
          gh workflow run pr-title.yml --ref "$BRANCH" --repo "$GITHUB_REPOSITORY"

  # Prebuilt binaries, built on Arch (the AUR's target) with its own libraries.
  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed git rustup pkgconf github-cli nodejs npm \
            gtk3 webkit2gtk-4.1 libglvnd libxkbcommon wayland pam dbus
          # rustup, for the Windows target of rustpaper-we-helper.exe
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
          rustup default stable
      - uses: actions/checkout@v4
      - name: Build the tarball
        run: ./packaging/dist.sh dist
      - name: PKGBUILD for rustpaper-bin with the real checksum
        run: |
          sum=$(cut -d' ' -f1 dist/rustpaper-$VERSION-x86_64-linux.tar.gz.sha256)
          sed -e "s/^pkgver=.*/pkgver=$VERSION/" -e "s/^sha256sums=.*/sha256sums=('$sum')/" \
            packaging/aur/rustpaper-bin/PKGBUILD > dist/rustpaper-bin.PKGBUILD
      - name: Attach to the release
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  # Rustpaper's own pacman repository: rustpaper-bin, signed, in the assets
  # of the fixed `pacman-repo` release (a prerelease, never "latest", so
  # releases/latest stays the version). Needs the PACMAN_GPG_KEY secret (an
  # armored signing key without passphrase); skipped until it is set.
  pacman-repo:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO_TAG: pacman-repo
    steps:
      - id: key
        env:
          KEY: ${{ secrets.PACMAN_GPG_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::PACMAN_GPG_KEY not set: not updating the pacman repository"; fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.ok == 'true'
      - name: Build and sign the repository
        if: steps.key.outputs.ok == 'true'
        env:
          KEY: ${{ secrets.PACMAN_GPG_KEY }}
        run: |
          pacman -Syu --noconfirm --needed github-cli git
          # makepkg refuses root: a builder user with its own keyring
          useradd -m builder
          mkdir -p release out && chown builder release out
          gh release download "$TAG" -p 'rustpaper-*-x86_64-linux.tar.gz' -p rustpaper-bin.PKGBUILD \
            -D release --repo "$GITHUB_REPOSITORY"
          chown -R builder release
          printf '%s\n' "$KEY" | su builder -c 'gpg --batch --import'
          fpr=$(su builder -c "gpg --list-secret-keys --with-colons" | awk -F: '/^fpr/{print $10; exit}')
          echo "FPR=$fpr" >> "$GITHUB_ENV"
          su builder -c "./packaging/pacman-repo.sh release out $fpr"
      - name: Publish to the pacman-repo release
        if: steps.key.outputs.ok == 'true'
        run: |
          git config --global --add safe.directory "$PWD"
          notes="Rustpaper's pacman repository (rustpaper-bin, the latest release). Signing key fingerprint: $FPR. Setup: README, Install."
          if ! gh release view "$REPO_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$REPO_TAG" --repo "$GITHUB_REPOSITORY" --title "pacman repository" \
              --notes "$notes" --prerelease --latest=false --target "$GITHUB_SHA"
          else
            gh release edit "$REPO_TAG" --repo "$GITHUB_REPOSITORY" --notes "$notes"
          fi
          # the package first, then the database that names it, then the old
          # package goes: a user syncing meanwhile always finds what the
          # database lists
          pkg=$(cd out && ls rustpaper-bin-*.pkg.tar.zst)
          gh release upload "$REPO_TAG" "out/$pkg" "out/$pkg.sig" --clobber --repo "$GITHUB_REPOSITORY"
          gh release upload "$REPO_TAG" out/rustpaper.db out/rustpaper.db.sig out/rustpaper.files \
            out/rustpaper.files.sig out/rustpaper.gpg --clobber --repo "$GITHUB_REPOSITORY"
          for a in $(gh release view "$REPO_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'); do
            case "$a" in
              "$pkg" | "$pkg.sig") ;;
              rustpaper-bin-*.pkg.tar.zst*) gh release delete-asset "$REPO_TAG" "$a" --yes --repo "$GITHUB_REPOSITORY" ;;
            esac
          done

  # Needs the AUR_SSH_PRIVATE_KEY secret (an AUR account's SSH key); skipped
  # until it is configured.
  aur:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pkg: [rustpaper-bin, rustpaper]
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - id: key
        env:
          KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::AUR_SSH_PRIVATE_KEY not set: not publishing ${{ matrix.pkg }}"; fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.ok == 'true'
      - name: Set the version
        if: steps.key.outputs.ok == 'true'
        run: sed -i -e "s/^pkgver=.*/pkgver=$VERSION/" -e "s/^pkgrel=.*/pkgrel=1/" packaging/aur/${{ matrix.pkg }}/PKGBUILD
      - uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        if: steps.key.outputs.ok == 'true'
        with:
          pkgname: ${{ matrix.pkg }}
          pkgbuild: packaging/aur/${{ matrix.pkg }}/PKGBUILD
          updpkgsums: true
          commit_username: ${{ github.actor }}
          commit_email: ${{ github.actor }}@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ needs.release-please.outputs.version }}"
