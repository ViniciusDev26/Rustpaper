# rustpaper-we-helper.exe and rustpaper_media.dll
# (crates/rustpaper-we-helper): no_std Windows programs linked by the
# rust-lld that ships with rustup, without a Windows SDK or C runtime. Needs
# `rustup target add x86_64-pc-windows-msvc`. Their entry points are set in
# that crate's build.rs.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"
rustflags = [
    "-C", "panic=abort",
    "-C", "link-arg=/NODEFAULTLIB",
]
