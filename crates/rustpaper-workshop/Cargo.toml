[package]
name = "rustpaper-workshop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
steamworks = "0.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# build.rs copies the libsteam_api.so this crate's build script extracts
# next to the binaries (same version as steamworks' own dependency).
[build-dependencies]
steamworks-sys = "0.13.0"
