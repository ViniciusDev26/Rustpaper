[package]
name = "rustpaper-selector"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "rustpaper-selector"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Shares the WE format logic with the engine.
rustpaper-core = { path = "../rustpaper-core" }
# Wallpaper previews -> Omarchy theme palette (palette.rs, omarchy.rs).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
# kill(2) for engines this selector did not start (main.rs).
libc = "0.2.186"
