<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rustpaper</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #1e1e2e; --bar: #181825; --card: #313244; --line: #313244;
        --muted: #6c7086; --sub: #a6adc8; --fg: #cdd6f4; --accent: #89b4fa;
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); height: 100vh; display: flex; flex-direction: column; }
      header { padding: 12px 20px; background: var(--bar); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
      header h1 { font-size: 1rem; margin: 0; font-weight: 600; }
      header .count { color: var(--muted); font-size: .85rem; white-space: nowrap; }
      header { flex-wrap: wrap; row-gap: 8px; }
      header input[type=search]#search { width: 180px; }
      header .spacer { flex: 1; }
      header select { background: var(--card); border: 1px solid #45475a; color: var(--fg); border-radius: 6px; padding: 5px 7px; }
      button.danger { background: #45475a; color: #f38ba8; }
      button.danger.confirm { background: #f38ba8; color: #11111b; }
      header input[type=search] { background: var(--card); border: 1px solid #45475a; color: var(--fg); border-radius: 6px; padding: 5px 9px; width: 220px; }
      #volume { width: 90px; accent-color: var(--accent); }
      label.check { white-space: nowrap; font-size: .85rem; color: var(--sub); display: flex; align-items: center; gap: 6px; cursor: pointer; }
      main { flex: 1; display: flex; min-height: 0; }
      #gallery { flex: 1; overflow-y: auto; }
      #status { padding: 20px; color: var(--sub); }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; padding: 20px; }
      .card { background: var(--card); border-radius: 10px; overflow: hidden; cursor: pointer; border: 2px solid transparent; transition: border-color .12s, transform .12s; }
      .card:hover { border-color: var(--accent); transform: translateY(-2px); }
      .card.selected { border-color: #f5c2e7; }
      .card.unsupported { opacity: .5; }
      .thumb, .no-thumb { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; display: block; background: #45475a; }
      .no-thumb { display: grid; place-items: center; color: var(--muted); font-size: .8rem; }
      .meta { padding: 8px 10px; }
      .title { font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .badge { display: inline-block; margin-top: 4px; font-size: .65rem; text-transform: uppercase; letter-spacing: .04em; padding: 2px 6px; border-radius: 4px; background: #585b70; color: var(--fg); }
      .badge.video { background: #a6e3a1; color: #11111b; }
      .badge.scene { background: var(--accent); color: #11111b; }

      /* customization panel (like WE's right-hand "Properties" column) */
      #panel { width: 340px; flex: none; background: var(--bar); border-left: 1px solid var(--line); overflow-y: auto; display: none; }
      #panel.open { display: block; }
      #panel .preview { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; display: block; background: #45475a; }
      #panel .head { padding: 12px 16px 4px; }
      #panel h2 { font-size: .95rem; margin: 0 0 8px; overflow-wrap: anywhere; }
      #panel .actions { display: flex; gap: 8px; padding: 0 16px 12px; }
      button { background: var(--accent); color: #11111b; border: 0; border-radius: 6px; padding: 6px 12px; font-weight: 600; cursor: pointer; }
      button.secondary { background: #45475a; color: var(--fg); }
      button:disabled { opacity: .5; cursor: default; }
      .props { padding: 4px 16px 20px; }
      .prop { padding: 7px 0; }
      .prop .label { font-size: .8rem; color: var(--sub); margin-bottom: 4px; display: flex; justify-content: space-between; gap: 8px; }
      .prop .label .val { color: var(--muted); font-variant-numeric: tabular-nums; }
      .prop input[type=range] { width: 100%; }
      .prop input[type=text], .prop select { width: 100%; background: var(--card); border: 1px solid #45475a; color: var(--fg); border-radius: 6px; padding: 5px 7px; }
      .prop input[type=color] { width: 56px; height: 28px; border: 1px solid #45475a; background: var(--card); border-radius: 6px; padding: 2px; }
      .prop.group { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); padding-top: 14px; border-bottom: 1px solid var(--line); }
      .prop.note { font-size: .78rem; color: var(--muted); }
      .empty { color: var(--muted); font-size: .85rem; padding: 4px 16px 16px; }
      /* tabs + Workshop store */
      .tabs { display: flex; gap: 4px; }
      .tab { background: transparent; color: var(--sub); padding: 5px 10px; font-weight: 500; }
      .tab.active { background: var(--card); color: var(--fg); }
      #store { flex: 1; overflow-y: auto; display: none; }
      body.store #store { display: block; }
      body.store #gallery, body.store #panel, body.store .library-only { display: none !important; }
      .store-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 14px 20px 0; }
      .store-bar input[type=search] { width: 260px; }
      .store-bar select, .store-bar input[type=search] { background: var(--card); border: 1px solid #45475a; color: var(--fg); border-radius: 6px; padding: 5px 9px; }
      #store-status { padding: 10px 20px 0; color: var(--sub); font-size: .85rem; }
      .store-card { cursor: default; }
      .store-card:hover { transform: none; border-color: transparent; }
      .store-card .stats { color: var(--muted); font-size: .72rem; margin-top: 4px; display: flex; justify-content: space-between; gap: 6px; }
      .store-card .row { display: flex; gap: 6px; margin-top: 8px; }
      .store-card .row button { flex: 1; padding: 5px 6px; font-size: .78rem; }
      .store-card .note { color: #f9e2af; font-size: .7rem; margin-top: 4px; }
      .badge.web { background: #f9e2af; color: #11111b; }
      .badge.rating { background: #f38ba8; color: #11111b; margin-left: 4px; }
      #store-more { display: block; margin: 0 auto 24px; }
      .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #11111b; padding: 8px 16px; border-radius: 8px; font-size: .85rem; opacity: 0; transition: opacity .2s; pointer-events: none; }
      .toast.show { opacity: 1; }
    </style>
  </head>
  <body>
    <header>
      <h1>Rustpaper</h1>
      <nav class="tabs">
        <button class="tab active" id="tab-library">Library</button>
        <button class="tab" id="tab-store" title="Browse and subscribe on the Steam Workshop (needs Steam running)">Workshop</button>
      </nav>
      <span class="count library-only" id="count"></span>
      <span class="spacer"></span>
      <input type="search" id="search" class="library-only" placeholder="Search" />
      <select id="lib-sort" class="library-only" title="Order of the library">
        <option value="title">Title (A–Z)</option>
        <option value="subscribed">Recently subscribed</option>
      </select>
      <label class="check" title="SceneScripts run in a sandbox (no files, network or processes)"><input type="checkbox" id="scripts" /> Run scripts</label>
      <label class="check" title="Volume of the wallpapers' own music and sounds (0 = muted)"><span id="volume-label">Volume</span> <input type="range" id="volume" min="0" max="100" step="5" /></label>
      <label class="check"><input type="checkbox" id="autostart" /> Start on login</label>
    </header>
    <main>
      <div id="gallery">
        <div id="status">Loading wallpapers…</div>
        <div class="grid" id="grid"></div>
      </div>
      <aside id="panel"></aside>
      <div id="store">
        <div class="store-bar">
          <input type="search" id="ws-search" placeholder="Search the Workshop (Enter)" />
          <select id="ws-sort">
            <option value="trend">Trending this week</option>
            <option value="top">Most popular</option>
            <option value="subscriptions">Most subscribed</option>
            <option value="recent">Most recent</option>
            <option value="updated">Recently updated</option>
            <option value="subscribed">My subscriptions</option>
          </select>
          <select id="ws-kind">
            <option value="all">All types</option>
            <option value="scene">Scene</option>
            <option value="video">Video</option>
            <option value="web">Web (not supported yet)</option>
          </select>
          <label class="check" title="Also show items rated Questionable or Mature"><input type="checkbox" id="ws-mature" /> Mature</label>
        </div>
        <div id="store-status"></div>
        <div class="grid" id="store-grid"></div>
        <button class="secondary" id="store-more" hidden>Load more</button>
      </div>
    </main>
    <div class="toast" id="toast"></div>

    <script src="properties.js"></script>
    <script src="workshop.js"></script>
    <script>
      const { invoke, convertFileSrc } = window.__TAURI__.core;
      const $ = (id) => document.getElementById(id);
      const el = (tag, props = {}, ...children) => {
        const n = Object.assign(document.createElement(tag), props);
        n.append(...children);
        return n;
      };

      let toastTimer;
      function showToast(msg) {
        $("toast").textContent = msg;
        $("toast").classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => $("toast").classList.remove("show"), 2000);
      }

      let wallpapers = [];
      let selected = null;

      async function apply(w) {
        try {
          await invoke("apply", { id: w.id });
          showToast(`Applied: ${w.title || w.id}`);
          openPanel(w);
        } catch (e) {
          showToast(`Error: ${e}`);
        }
      }

      function card(w) {
        const thumb = w.preview
          ? el("img", { className: "thumb", loading: "lazy", src: convertFileSrc(w.preview) })
          : el("div", { className: "no-thumb", textContent: "no preview" });
        const node = el("div", { className: "card" + (w.supported ? "" : " unsupported") },
          thumb,
          el("div", { className: "meta" },
            el("div", { className: "title", title: w.title, textContent: w.title || w.id }),
            el("span", { className: `badge ${w.kind}`, textContent: w.kind })));
        node.dataset.id = w.id;
        // Like WE: one click applies the wallpaper and shows its properties.
        node.addEventListener("click", () => (w.supported ? apply(w) : openPanel(w)));
        return node;
      }

      // Library order: title, or most recently subscribed first. Steam's
      // subscription times come from the Workshop helper (Steam running);
      // without it, the folder's creation time (the download) stands in.
      let sortMode = "title";
      try { sortMode = localStorage.getItem("rp-lib-sort") || "title"; } catch {}
      let subTimes = null; // { id: unix seconds } once fetched

      async function ensureSubTimes() {
        if (sortMode !== "subscribed" || subTimes) return;
        try {
          subTimes = await invoke("workshop_subscriptions");
        } catch (e) {
          subTimes = {};
          showToast("Steam unavailable: sorting by download date");
        }
      }

      function sorted(list) {
        if (sortMode !== "subscribed") return list; // backend sends title order
        // Steam's subscriptions first (by subscription time), then folders
        // without an active subscription (old installs) by download date
        const sub = (w) => (subTimes && subTimes[w.id]) || 0;
        return [...list].sort((a, b) =>
          (sub(b) > 0) - (sub(a) > 0) || sub(b) - sub(a) || (b.added || 0) - (a.added || 0));
      }

      function renderGrid() {
        const q = $("search").value.trim().toLowerCase();
        const shown = sorted(wallpapers.filter((w) => !q || (w.title || "").toLowerCase().includes(q) || w.id.includes(q)));
        $("grid").replaceChildren(...shown.map(card));
        $("count").textContent = `${shown.length} wallpapers`;
        markSelected();
      }

      function markSelected() {
        for (const c of $("grid").children) c.classList.toggle("selected", c.dataset.id === selected?.id);
      }

      // Unsubscribe from the panel: two clicks (the folder is deleted), the
      // second within 4 s.
      function unsubscribeButton(w) {
        const b = el("button", { className: "danger", textContent: "Unsubscribe" });
        let armed = null;
        b.addEventListener("click", async () => {
          if (!armed) {
            b.textContent = "Click to confirm";
            b.classList.add("confirm");
            armed = setTimeout(() => {
              armed = null;
              b.textContent = "Unsubscribe";
              b.classList.remove("confirm");
            }, 4000);
            return;
          }
          clearTimeout(armed);
          b.disabled = true;
          b.textContent = "Unsubscribing…";
          try {
            await invoke("workshop_unsubscribe", { id: w.id });
            showToast(`Unsubscribed: ${w.title || w.id}`);
            await reloadLibrary();
          } catch (e) {
            showToast(`${e}`);
            armed = null;
            b.disabled = false;
            b.textContent = "Unsubscribe";
            b.classList.remove("confirm");
          }
        });
        return b;
      }

      // ---- customization panel ------------------------------------------
      async function openPanel(w) {
        selected = w;
        markSelected();
        const panel = $("panel");
        panel.classList.add("open");
        const head = el("div", { className: "head" }, el("h2", { textContent: w.title || w.id }),
          el("span", { className: `badge ${w.kind}`, textContent: w.kind }));
        const preview = w.preview ? el("img", { className: "preview", src: convertFileSrc(w.preview) }) : "";
        panel.replaceChildren(preview, head);
        if (!w.supported) {
          if (w.workshop) panel.append(el("div", { className: "actions" }, unsubscribeButton(w)));
          panel.append(el("div", { className: "empty", textContent: w.kind === "web"
            ? "Web wallpapers run the author's JavaScript and are not supported."
            : "This wallpaper type is not supported." }));
          return;
        }
        let view;
        try {
          view = await invoke("get_properties", { id: w.id });
        } catch (e) {
          panel.append(el("div", { className: "empty", textContent: `${e}` }));
          return;
        }
        if (selected !== w) return; // another card was clicked meanwhile

        const values = {}; // current value of every property (defaults + saved)
        for (const p of view.properties) values[p.name] = p.name in view.saved ? view.saved[p.name] : p.value;
        const changed = () => Object.fromEntries(Object.entries(values)
          .filter(([k, v]) => { const p = view.properties.find((q) => q.name === k); return p && !sameValue(v, p.value); }));

        const props = el("div", { className: "props" });
        const reset = el("button", { className: "secondary", textContent: "Reset" });
        const applyBtn = el("button", { textContent: "Apply" });
        const actions = el("div", { className: "actions" }, applyBtn, reset);
        if (w.workshop) actions.append(unsubscribeButton(w));
        panel.append(actions, props);
        applyBtn.addEventListener("click", () => apply(w));

        // Saving restarts the engine on the new values; debounce so dragging
        // a slider produces one restart, not one per pixel.
        let saveTimer;
        const save = () => {
          clearTimeout(saveTimer);
          saveTimer = setTimeout(async () => {
            try { await invoke("save_properties", { id: w.id, values: changed() }); }
            catch (e) { showToast(`Error: ${e}`); }
          }, 700);
        };
        reset.addEventListener("click", async () => {
          for (const p of view.properties) values[p.name] = p.value;
          await invoke("save_properties", { id: w.id, values: {} }).catch((e) => showToast(`Error: ${e}`));
          draw();
        });

        function draw() {
          const rows = view.properties
            .filter((p) => !p.condition || RpProps.evalCondition(p.condition, values))
            .map((p) => RpProps.control(p, values[p.name], (v) => { values[p.name] = v; save(); draw(); }))
            .filter(Boolean);
          props.replaceChildren(...(rows.length ? rows : [el("div", { className: "empty", textContent: "No customizable properties." })]));
        }
        draw();
      }

      function sameValue(a, b) {
        return JSON.stringify(a) === JSON.stringify(b);
      }

      // Re-scans the Workshop folders (after a download or unsubscribe in the
      // store); keeps the panel when its wallpaper is still there.
      async function reloadLibrary() {
        wallpapers = await invoke("list_wallpapers");
        if (sortMode === "subscribed") {
          subTimes = null; // a store (un)subscribe changed the list
          await ensureSubTimes();
        }
        if (selected && !wallpapers.some((w) => w.id === selected.id)) {
          selected = null;
          $("panel").classList.remove("open");
        }
        renderGrid();
      }

      function showTab(store) {
        document.body.classList.toggle("store", store);
        $("tab-library").classList.toggle("active", !store);
        $("tab-store").classList.toggle("active", store);
        if (store) RpStore.open();
        else reloadLibrary().catch((e) => showToast(`${e}`));
      }
      $("tab-library").addEventListener("click", () => showTab(false));
      $("tab-store").addEventListener("click", () => showTab(true));
      RpStore.init({ invoke, el, $, showToast, reloadLibrary,
        applyInstalled: (id) => {
          const w = wallpapers.find((x) => x.id === id);
          if (!w) return showToast("Not in the library yet");
          showTab(false);
          apply(w);
        } });

      $("search").addEventListener("input", renderGrid);
      $("lib-sort").value = sortMode;
      $("lib-sort").addEventListener("change", async (ev) => {
        sortMode = ev.target.value;
        try { localStorage.setItem("rp-lib-sort", sortMode); } catch {}
        await ensureSubTimes();
        renderGrid();
      });
      $("autostart").addEventListener("change", async (ev) => {
        try {
          await invoke("set_autostart", { enabled: ev.target.checked });
          showToast(ev.target.checked ? "Autostart on" : "Autostart off");
        } catch (e) {
          ev.target.checked = !ev.target.checked;
          showToast(`${e}`);
        }
      });

      $("scripts").addEventListener("change", async (ev) => {
        try {
          await invoke("set_scripts", { enabled: ev.target.checked });
          showToast(ev.target.checked ? "Scripts on" : "Scripts off");
        } catch (e) {
          ev.target.checked = !ev.target.checked;
          showToast(`${e}`);
        }
      });

      const volumeText = (v) => (Number(v) === 0 ? "Muted" : `Volume ${v}%`);
      // label follows the drag; the engine restarts only on release
      $("volume").addEventListener("input", (ev) => {
        $("volume-label").textContent = volumeText(ev.target.value);
      });
      $("volume").addEventListener("change", async (ev) => {
        try {
          await invoke("set_volume", { volume: Number(ev.target.value) });
          showToast(volumeText(ev.target.value));
        } catch (e) {
          showToast(`${e}`);
        }
      });

      (async () => {
        try {
          const settings = await invoke("get_settings");
          $("volume").value = settings.volume;
          $("volume-label").textContent = volumeText(settings.volume);
          $("autostart").checked = settings.autostart;
          $("scripts").checked = !settings.no_scripts;
          wallpapers = await invoke("list_wallpapers");
          await ensureSubTimes();
          $("status").style.display = "none";
          renderGrid();
          const last = wallpapers.find((w) => w.id === settings.last_id);
          if (last) openPanel(last);
        } catch (e) {
          $("status").textContent = `Failed to load: ${e}`;
        }
      })();
    </script>
  </body>
</html>
