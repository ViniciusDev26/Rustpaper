[package]
name = "rustpaper-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Wallpaper Engine format logic (project.json, .pkg, .tex, scene.json).
# No graphics dependencies: a pure library shared by the engine and the selector.
[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
lz4_flex = "0.13.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
texpresso = "2.0.2"

# TESTS only: checks that the GLSL we produce compiles in the same frontend
# (naga) wgpu uses. Version matched to the engine's wgpu 29.
[dev-dependencies]
naga = { version = "29.0.3", features = ["glsl-in", "spv-in", "wgsl-out"] }
