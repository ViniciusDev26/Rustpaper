[package]
name = "rustpaper-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Binary named rustpaper (keeps the known path: target/debug/rustpaper).
[[bin]]
name = "rustpaper"
path = "src/main.rs"

[dependencies]
rustpaper-core = { path = "../rustpaper-core" }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
wayland-client = "0.31"
# ext-image-copy-capture & co. are in `staging`
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
libc = "0.2.186"
# the private stage: our own headless compositor + XWayland (stage.rs)
smithay = { version = "0.7", default-features = false, features = ["wayland_frontend", "xwayland"] }
