[package]
name = "rustpaper-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Binary named rustpaper (keeps the known path: target/debug/rustpaper).
[[bin]]
name = "rustpaper"
path = "src/main.rs"

[dependencies]
rustpaper-core = { path = "../rustpaper-core" }
# feature `spirv`: accept ShaderSource::SpirV (WE shaders compiled with glslang).
wgpu = { version = "29.0.3", features = ["spirv"] }
# SPIR-V reflection (uniform block layout + bindings), same version as wgpu.
naga = { version = "29.0.3", features = ["spv-in"] }
serde_json = "1.0.150"
pollster = "0.4.0"
bytemuck = { version = "1.25.0", features = ["derive"] }
raw-window-handle = "0.6"
smithay-client-toolkit = "0.19"
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
calloop = "0.14"
calloop-wayland-source = "0.4"
# Scenes render on OpenGL (rustpaper-gl) into one EGL window per output.
rustpaper-gl = { path = "../rustpaper-gl" }
wayland-egl = "0.32"
wayland-protocols = { version = "0.32", features = ["client"] }

# Examples only (render_material writes a PNG for offscreen inspection).
[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
