[package]
name = "rustpaper-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Binary named rustpaper (keeps the known path: target/debug/rustpaper).
[[bin]]
name = "rustpaper"
path = "src/main.rs"

[dependencies]
rustpaper-core = { path = "../rustpaper-core" }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
wayland-client = "0.31"
# ext-image-copy-capture & co. are in `staging`
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
libc = "0.2.186"
# the private stage: our own headless compositor + XWayland (stage.rs)
smithay = { version = "0.7", default-features = false, features = ["wayland_frontend", "xwayland"] }
# the lock screen (lock/): keyboard, its panel (shapes and text drawn on the
# CPU), the still fallback picture, logind
xkbcommon = { version = "0.8", default-features = false }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
dbus = "0.9"
