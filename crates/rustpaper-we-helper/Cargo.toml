[package]
name = "rustpaper-we-helper"
description = "Runs inside Wallpaper Engine's Proton prefix: marks Rustpaper's WE windows as the desktop, so web wallpapers take clicks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# A Windows program (built with `--target x86_64-pc-windows-msvc`, linked by
# rust-lld from .cargo/config.toml): no std, no C runtime, only user32 and
# kernel32 through raw-dylib, so no Windows SDK is needed. On the host it is
# a stub, which keeps `cargo build/clippy/test --workspace` working.
